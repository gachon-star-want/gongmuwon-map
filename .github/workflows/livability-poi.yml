name: Monthly livability POI

# 동네 POI 근거(학교/어린이집 등) 적재 (ADR-019, P2b-POI).
# data.go.kr odcloud에서 받아 읍면동 경계 내(PIP) 카운트를 사전계산한다.
# POI는 점수와 무관(표시 전용)이라 ingest/요약과 분리한다. 연 단위 데이터라 월 1회로 충분.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "시도 코드(공백=전국). 예: 33"
        required: false
        type: string
  schedule:
    - cron: "0 22 1 * *" # 매월 1일 22:00 UTC — 요약(21:00) 뒤

permissions:
  contents: read

jobs:
  poi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Ingest POI (학교/어린이집 PIP 카운트)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${DATA_GO_KR_API_KEY:-}" ]; then
            echo "DATABASE_URL / DATA_GO_KR_API_KEY secrets가 필요합니다" >&2
            exit 2
          fi
          ARGS=""
          SCOPE="${{ github.event.inputs.scope }}"
          if [ -n "$SCOPE" ]; then
            ARGS="--sido $SCOPE"
          fi
          uv run --project services/pipeline python \
            services/pipeline/scripts/ingest_poi.py $ARGS

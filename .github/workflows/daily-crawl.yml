name: Daily crawl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PIPELINE_HTTP_BACKEND: auto
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Seed agencies
        run: uv run --project services/pipeline public-officer-pipeline seed-agencies

      - name: Crawl recent public expense posts
        run: |
          set +e
          since="$(date -u -d '31 days ago' +%F)"
          failures=0
          uv run --project services/pipeline python -c 'from public_officer_pipeline.agencies import SEOUL_AGENCIES; [print(agency.short_name) for agency in SEOUL_AGENCIES]' > /tmp/agencies.txt
          while IFS= read -r agency; do
            echo "::group::${agency}"
            uv run --project services/pipeline public-officer-pipeline run-agency "$agency" \
              --since "$since" \
              --limit-pages 2 \
              --max-posts 2 \
              --allow-deterministic-normalizer \
              --allow-unmatched-places
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "${agency} failed with status ${status}" >> /tmp/crawl-failures.txt
            fi
          done < /tmp/agencies.txt
          if [ "$failures" -gt 0 ]; then
            cat /tmp/crawl-failures.txt
            exit 1
          fi

      - name: Refresh public views
        if: always()
        run: uv run --project services/pipeline public-officer-pipeline refresh-views

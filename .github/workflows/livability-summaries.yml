name: Monthly livability summaries

# 동네 한 줄 요약(룰 claim + LLM 윤색·게이트) 생성 (ADR-018, P2b-요약).
# neighborhood_field_scores_v1(점수 MV)에만 의존하므로 ingest와 분리한다.
# ingest 워크플로우 실패가 요약을 막지 않고, 요약만 독립적으로 재실행/검증할 수 있다.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "시도 코드(공백=전국). 예: 33 또는 '33 25 32'"
        required: false
        type: string
      no_llm:
        description: "LLM 윤색 끄기(룰 기반만)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 21 1 * *" # 매월 1일 21:00 UTC — ingest(18:00) 3시간 뒤

permissions:
  contents: read

jobs:
  summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Generate neighborhood summaries (LLM 키 없으면 룰 폴백)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret이 필요합니다" >&2
            exit 2
          fi
          ARGS=""
          SCOPE="${{ github.event.inputs.scope }}"
          if [ -n "$SCOPE" ]; then
            ARGS="--sido $SCOPE"
          fi
          if [ "${{ github.event.inputs.no_llm }}" = "true" ]; then
            ARGS="$ARGS --no-llm"
          fi
          uv run --project services/pipeline python \
            services/pipeline/scripts/generate_neighborhood_summaries.py $ARGS

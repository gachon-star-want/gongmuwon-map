name: PR Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  repo-safety:
    name: repo-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Block committed env files
        run: |
          set -euo pipefail
          changed_env_files="$(
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" |
              awk '
                {
                  n = split($0, parts, "/");
                  base = parts[n];
                  if (base ~ /^\.env($|\.)/ && base != ".env.example") print $0;
                }
              '
          )"

          if [ -n "$changed_env_files" ]; then
            echo "Do not commit local environment files:"
            echo "$changed_env_files"
            exit 1
          fi

      - name: Scan for obvious secret literals
        run: |
          set -euo pipefail
          if git grep -nE 'postgresql://[^[:space:]]+:[^[:space:]]+@|npg_[A-Za-z0-9]{8,}|gho_[A-Za-z0-9_]{20,}' -- ':!.env.example' ':!.github/workflows/pr-gate.yml'; then
            echo "Potential secret literal found in tracked files."
            exit 1
          fi

      - name: Enforce score/POI isolation (ADR-019)
        run: |
          set -euo pipefail
          # 점수 MV(neighborhood_scores_v1 / field_scores_v1) 정의 파일이 POI 테이블을 참조하면
          # "시설 많음=좋은 동네"로 점수가 오염된다. 같은 파일에 둘 다 등장하면 실패시킨다.
          violators=$(grep -lE 'neighborhood_(scores|field_scores)_v1' supabase/migrations/*.sql 2>/dev/null \
            | xargs grep -lE 'neighborhood_poi_counts|poi_type_catalog' 2>/dev/null || true)
          if [ -n "$violators" ]; then
            echo "❌ ADR-019 위반: 점수 MV 정의 파일이 POI 테이블을 참조합니다:" >&2
            echo "$violators" >&2
            exit 1
          fi
          echo "✅ 점수 MV ↔ POI 분리 확인"

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test:web

  public-contracts:
    name: public-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public route contracts
        run: npm run check:public-contracts

  api-typecheck:
    name: api-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API bundle (catches missing/untracked imports)
        run: npm run typecheck:api
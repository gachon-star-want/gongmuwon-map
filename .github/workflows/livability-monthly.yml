name: Monthly livability ingest

# 매월 1일 전국 거주적합도('동네') 데이터 재적재 + 점수 refresh.
# 데이터 출처(SGIS/KOSIS 등록센서스)는 연 단위 갱신이라, 월 1회 새 데이터를 확인·반영한다.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "시도 코드(공백=전국). 예: 33 또는 '33 25 32'"
        required: false
        type: string
  schedule:
    - cron: "0 18 1 * *" # 매월 1일 18:00 UTC (KST 2일 03:00)

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SGIS_SERVICE_ID: ${{ secrets.SGIS_SERVICE_ID }}
      SGIS_API_KEY: ${{ secrets.SGIS_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Ingest livability (scope 지정 시 해당 시도, 공백이면 전국)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SGIS_SERVICE_ID:-}" ] || [ -z "${SGIS_API_KEY:-}" ] || [ -z "${KOSIS_API_KEY:-}" ]; then
            echo "DATABASE_URL / SGIS_SERVICE_ID / SGIS_API_KEY / KOSIS_API_KEY secrets가 필요합니다" >&2
            exit 2
          fi
          uv run --project services/pipeline python \
            services/pipeline/scripts/ingest_nationwide_livability.py ${{ github.event.inputs.scope }}

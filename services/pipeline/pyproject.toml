[project]
name = "public-officer-pipeline"
version = "0.1.0"
description = "Public Officer Map crawler, extractor, normalizer, entity resolver, and Neon loader"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.13",
  "pydantic>=2.12.4",
  "python-dateutil>=2.9.0.post0",
  "selectolax>=0.4.4"
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.6"
]

[project.scripts]
public-officer-pipeline = "public_officer_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
